name: Cat

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC, so the cat reflects the week that just ended
  workflow_dispatch:
    inputs:
      coat:
        description: "Coat"
        type: choice
        default: naranja
        options: [gris, naranja, calico, siames, blanco, esmoquin, negro, atigrado]
      state:
        description: "State (auto = from your commits)"
        type: choice
        default: auto
        options: [auto, sleep, small, medium, large]
  push:
    paths: [.github/workflows/cat.yml]

permissions:
  contents: write

concurrency: cat

jobs:
  cat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Marescaa/catfolio@v2
        with:
          coat: ${{ inputs.coat || vars.CAT_COAT || 'naranja' }}
          state: ${{ inputs.state || vars.CAT_STATE || 'auto' }}
      - name: Commit the cat if it changed
        run: |
          git add cat/cat.gif
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "cat: update mood"
          git push -q
